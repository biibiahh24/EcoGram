<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#3edf81"><title>Criar perfil · EcoGram</title><link rel="stylesheet" href="auth.css"><script src="auth.js" defer></script></head>
<body class="auth-page"><main class="auth-panel"><div class="auth-logo"><img src="EcoGram.png" alt="EcoGram" class="logo-small"></div>
<section class="auth-card"><p class="auth-kicker">SUA COMUNIDADE VERDE 🌿</p><h1>Criar perfil</h1><p class="auth-subtitle">Escolha seu nome de exibição e participe da comunidade EcoGram.</p>
<form id="register-form"><label for="fullname">Nome</label><input id="fullname" name="fullname" autocomplete="name" placeholder="Como você quer aparecer" minlength="2" maxlength="50" required>
<label for="nickname">Usuário</label><input id="nickname" name="nickname" autocomplete="nickname" pattern="[a-zA-Z0-9_]{3,20}" title="Use de 3 a 20 letras, números ou _" placeholder="seu_usuario" required>
<button type="submit" class="primary-button">Criar perfil e entrar</button></form>
<p class="auth-links">Já tem conta? <a href="login.html">Entrar</a></p></section>
<p class="auth-disclaimer">O perfil é criado apenas nesta sessão do navegador, sem conta online. Não informe dados sensíveis.</p>
</main></body></html>
