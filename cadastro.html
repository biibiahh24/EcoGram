<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5faf3"><link rel="icon" href="ecogram-mark.svg" type="image/svg+xml"><title>Criar perfil · EcoGram</title><link rel="stylesheet" href="auth.css"><script type="module" src="auth.js"></script></head>
<body class="auth-page"><main class="auth-panel"><div class="auth-logo"><img src="ecogram-logo.svg" alt="EcoGram" class="logo-small"></div>
<section class="auth-card"><p class="auth-kicker">SUA COMUNIDADE VERDE 🌿</p><h1>Criar perfil</h1><p class="auth-subtitle">Crie uma conta com seu e-mail e descubra sua comunidade sustentável.</p>
<form id="register-form"><label for="fullname">Nome</label><input id="fullname" name="fullname" autocomplete="name" placeholder="Como você quer aparecer" minlength="2" maxlength="50" required>
<label for="nickname">Usuário</label><input id="nickname" name="nickname" autocomplete="nickname" pattern="[a-zA-Z0-9_]{3,20}" title="Use de 3 a 20 letras, números ou _" placeholder="seu_usuario" required>
<label for="email">E-mail</label><input id="email" name="email" type="email" autocomplete="email" placeholder="voce@exemplo.com" required><label for="password">Senha</label><input id="password" name="password" type="password" autocomplete="new-password" placeholder="Pelo menos 8 caracteres" minlength="8" required><button type="submit" class="primary-button">Criar minha conta</button><p id="register-status" class="auth-feedback" role="alert" hidden></p></form>
<p class="auth-links">Já tem conta? <a href="login.html">Entrar</a></p></section>
<p class="auth-disclaimer">Ao se cadastrar, você poderá precisar confirmar seu e-mail para ativar a conta.</p>
</main></body></html>
