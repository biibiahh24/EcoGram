<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5faf3"><link rel="icon" href="ecogram-mark.svg" type="image/svg+xml"><title>Recuperar senha · EcoGram</title><link rel="stylesheet" href="auth.css"><script type="module" src="auth.js"></script></head>
<body class="auth-page"><main class="auth-panel"><div class="auth-logo"><img src="ecogram-logo.svg" alt="EcoGram" class="logo-small"></div><section class="auth-card"><p class="auth-kicker">ACESSO ECOGRAM</p><h1>Recuperar senha</h1><p class="auth-subtitle">Informe o e-mail cadastrado para receber um link de recuperação.</p>
<form id="recover-form"><label for="recover-email">E-mail da conta</label><input id="recover-email" type="email" autocomplete="email" placeholder="voce@exemplo.com" required><button class="primary-button" type="submit">Enviar link de recuperação</button><p id="recover-status" class="auth-feedback" role="alert" hidden></p></form>
<form id="reset-form" hidden><label for="new-password">Nova senha</label><input id="new-password" type="password" autocomplete="new-password" minlength="8" placeholder="Pelo menos 8 caracteres" required><button class="primary-button" type="submit">Atualizar senha</button><p id="reset-status" class="auth-feedback" role="alert" hidden></p></form>
<p class="auth-links"><a href="login.html">Voltar ao login</a></p></section></main></body></html>
