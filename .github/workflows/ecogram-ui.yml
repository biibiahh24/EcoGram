name: EcoGram UI checks
on:
  pull_request:
  push:
    branches: [fix/ecogram-original-app]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: for file in auth.js app-session.js js_script.js explorar.js challenges.js new-post.js; do node --check "$file"; done
      - run: node --test tests/app-ui.test.mjs
